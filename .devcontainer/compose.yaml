services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity

  db:
    image: postgres:14-alpine3.16
    container_name: walter_dev_db
    restart: unless-stopped
    volumes:
      - ./test_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=walter_dev_full_generic_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data

  # SeaweedFS (Apache-2.0) is the S3-compatible file backend for development.
  # Walter talks to it without signing requests, so the bucket must accept
  # anonymous access: SeaweedFS does that as long as no identities are configured.
  s3:
    image: chrislusf/seaweedfs:4.53
    container_name: walter_dev_s3
    restart: unless-stopped
    command: server -s3 -dir=/data -s3.port=9000
    volumes:
      - s3-data-seaweedfs:/data
    ports:
      - 9000:9000

  # One-shot helper that creates the saverwalter bucket (an existing bucket
  # answers 409, which is fine). Anonymous access for development only;
  # production deployments must put the S3 server behind proper credentials.
  s3-init:
    image: curlimages/curl:8.23.0
    container_name: walter_dev_s3_init
    depends_on:
      - s3
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until curl -s -o /dev/null http://s3:9000/; do
        echo 'Waiting for S3 at s3:9000...';
        sleep 1;
      done;
      curl -s -o /dev/null -X PUT http://s3:9000/saverwalter;
      echo 'S3 bucket saverwalter ready (anonymous access for development).';
      "

volumes:
  postgres-data:
  s3-data-seaweedfs:
